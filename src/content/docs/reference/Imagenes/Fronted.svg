<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" style="background-color: #ffffff; font-family: 'Courier New', Courier, monospace; font-size: 13px;">
  <style>
    .path { fill: #333333; }
    .folder { fill: #000000; font-weight: bold; }
    .comment { fill: #4a4a4a; font-family: Arial, sans-serif; font-size: 11px; }
    .box { fill: #f4f4f6; stroke: #d0d0d5; rx: 4; ry: 4; }
  </style>

  <rect width="100%" height="100%" fill="#ffffff" />

  <text x="20" y="30" class="folder" font-size="14">src/</text>

  <text x="20" y="50" class="path">├── assets/</text>
  <rect x="300" y="38" width="415" height="18" class="box"/>
  <text x="305" y="51" class="comment">[ Estilos globales index.css y directrices de Tailwind CSS ]</text>

  <text x="20" y="70" class="path">├── router/</text>
  <rect x="300" y="58" width="460" height="18" class="box"/>
  <text x="305" y="71" class="comment">[ index.js (Configuración del enrutador asíncrono y Lazy-Loading) ]</text>

  <text x="20" y="90" class="path">├── stores/</text>
  <rect x="300" y="78" width="455" height="18" class="box"/>
  <text x="305" y="91" class="comment">[ Pinia Stores (Patrón Store-as-a-Service y Reactive Buffering) ]</text>

  <text x="20" y="110" class="path">├── views/</text>

  <text x="20" y="130" class="path">│   ├── LoginView.vue</text>
  <rect x="300" y="118" width="375" height="18" class="box"/>
  <text x="305" y="131" class="comment">[ Portal de Autenticación y Persistencia local JWS ]</text>

  <text x="20" y="150" class="path">│   ├── DashboardGeneralView.vue</text>
  <rect x="300" y="138" width="410" height="18" class="box"/>
  <text x="305" y="151" class="comment">[ Panel Mando Central con Menú de navegación elástico ]</text>

  <text x="20" y="170" class="path">│   ├── SystemSettingsView.vue</text>
  <rect x="300" y="158" width="400" height="18" class="box"/>
  <text x="305" y="171" class="comment">[ Configuración Global, mutación de temas e idiomas ]</text>

  <text x="20" y="190" class="path">│   ├── NotificationCenterView.vue</text>
  <rect x="300" y="178" width="375" height="18" class="box"/>
  <text x="305" y="191" class="comment">[ Bandeja de Alertas acoplada a &lt;TransitionGroup&gt; ]</text>

  <text x="20" y="210" class="path">│   ├── UserProfileView.vue</text>
  <rect x="300" y="198" width="355" height="18" class="box"/>
  <text x="305" y="211" class="comment">[ Perfil de Usuario y evaluación de la matriz ACL ]</text>

  <text x="20" y="230" class="path">│   ├── AdminVoluntariosView.vue</text>
  <rect x="300" y="218" width="295" height="18" class="box"/>
  <text x="305" y="231" class="comment">[ Gestión ágil de personal voluntario ]</text>

  <text x="20" y="250" class="path">│   ├── AdminListaPersonalView.vue</text>
  <rect x="300" y="238" width="415" height="18" class="box"/>
  <text x="305" y="251" class="comment">[ Alta densidad operativa basada en CSS Grid de 3 col. ]</text>

  <text x="20" y="270" class="path">│   ├── AdminStatsView.vue</text>
  <rect x="300" y="258" width="400" height="18" class="box"/>
  <text x="305" y="271" class="comment">[ Capa BI: Lienzo interactivo basado en HTML5 Canvas ]</text>

  <text x="20" y="290" class="path">│   ├── AdminTramitesView.vue</text>
  <rect x="300" y="278" width="380" height="18" class="box"/>
  <text x="305" y="291" class="comment">[ Factoría dinámica polimórfica y exportación jsPDF ]</text>

  <text x="20" y="310" class="path">│   └── ProjectDetailView.vue</text>
  <rect x="300" y="298" width="380" height="18" class="box"/>
  <text x="305" y="311" class="comment">[ Ficha Auditoría con compuerta lógica v-if="project" ]</text>

  <text x="20" y="330" class="path">└── components/</text>
  <rect x="300" y="318" width="450" height="18" class="box"/>
  <text x="305" y="331" class="comment">[ Componentes funcionales, modulares y atómicos reutilizables ]</text>
</svg>

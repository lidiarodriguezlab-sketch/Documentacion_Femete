<svg xmlns="http://www.w3.org/2000/svg" width="850" height="420" viewBox="0 0 850 420" style="background-color: #ffffff; font-family: 'Courier New', Courier, monospace; font-size: 13px;">
  <style>
    .path { fill: #333333; }
    .folder { fill: #000000; font-weight: bold; }
    .file { fill: #2b2b2b; }
    .comment { fill: #4a4a4a; font-family: Arial, sans-serif; font-size: 11px; }
    .box { fill: #f4f4f6; stroke: #d0d0d5; rx: 4; ry: 4; }
  </style>

  <rect width="100%" height="100%" fill="#ffffff" />

  <text x="20" y="30" class="folder" font-size="14">src/main/java/org/domitila/api/</text>

  <text x="20" y="50" class="path">├── common/</text>
  <text x="20" y="70" class="path">│   ├── config/</text>
  <rect x="230" y="58" width="280" height="18" class="box"/>
  <text x="235" y="71" class="comment">[ OpenApiConfig, WebMvcConfig (CORS) ]</text>

  <text x="20" y="90" class="path">│   ├── security/</text>
  <rect x="230" y="78" width="295" height="18" class="box"/>
  <text x="235" y="91" class="comment">[ JwtAuthenticationFilter, SecurityConfig ]</text>

  <text x="20" y="110" class="path">│   └── exception/</text>
  <rect x="230" y="98" width="265" height="18" class="box"/>
  <text x="235" y="111" class="comment">[ GlobalExceptionHandler, ErrorResponse ]</text>

  <text x="20" y="130" class="path">└── modules/</text>
  
  <text x="20" y="150" class="path">    ├── personal/</text>
  <rect x="230" y="138" width="350" height="18" class="box"/>
  <text x="235" y="151" class="comment">[ Entidades, Controles Horarios, Vacaciones, Permisos ]</text>

  <text x="20" y="170" class="path">    ├── proyectos/</text>
  <rect x="230" y="158" width="415" height="18" class="box"/>
  <text x="235" y="171" class="comment">[ Lógica de Fechas, Asignaciones y Converter de Estado ]</text>

  <text x="20" y="190" class="path">    ├── beneficiarios/</text>
  <rect x="230" y="178" width="365" height="18" class="box"/>
  <text x="235" y="191" class="comment">[ Gestión con Baja Lógica y Restricción Concurrente ]</text>

  <text x="20" y="210" class="path">    └── shared/</text>
  <rect x="230" y="198" width="300" height="18" class="box"/>
  <text x="235" y="211" class="comment">[ Converters JPA de Dominio y DTOs comunes ]</text>

  <text x="20" y="245" class="folder" font-size="14">src/main/resources/</text>
  <text x="20" y="265" class="path">├── application.yml</text>
  <text x="235" y="265" class="comment">(Configuración compartida base del servidor)</text>

  <text x="20" y="285" class="path">├── application-local.yml</text>
  <text x="235" y="285" class="comment">(Perfil Local: Logs en DEBUG + Swagger UI habilitado)</text>

  <text x="20" y="305" class="path">└── application-prod.yml</text>
  <text x="235" y="305" class="comment">(Perfil Producción: Inyección estricta de variables .env)</text>

  <text x="20" y="340" class="folder" font-size="14">src/test/java/org/domitila/api/</text>
  <text x="20" y="360" class="path">└── modules/</text>
  <rect x="230" y="348" width="340" height="18" class="box"/>
  <text x="235" y="361" class="comment">[ Suites de Pruebas Unitarias con JUnit 5 y Mockito ]</text>
</svg>
